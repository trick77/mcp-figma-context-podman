services:
  figma-context-mcp:
    image: ghcr.io/trick77/figma-context-mcp:latest
    container_name: figma-context-mcp
    restart: "no"
    env_file: .env
    environment:
      # Mount the host dir at the same absolute path inside the container
      # AND tell upstream to write there. Result: the path upstream returns
      # in download_figma_images responses is directly openable on the
      # host — agents need no translation, no per-project instructions.
      # Overrides the Containerfile's IMAGE_DIR=/home/node/images default.
      # Default must be a literal absolute path (podman-compose does NOT
      # expand $HOME inside a default fallback — keep it shell-free).
      IMAGE_DIR: ${IMAGES_HOST_DIR:-/var/tmp/figma-context-mcp}
    ports:
      - "127.0.0.1:23149:3333"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # Image-download dir. download_figma_images writes here; host-side
      # agents read the files at the EXACT path the tool returns, because
      # source == target. Default /var/tmp/figma-context-mcp works for
      # rootless podman on Linux (world-writable sticky dir, persists
      # across reboots). Override via IMAGES_HOST_DIR in .env to land
      # files elsewhere (must be a literal absolute path). ',Z' relabels
      # for SELinux; ',U' chowns the host source to the mapped container
      # UID so the non-root `node` user can write — use a dedicated/empty
      # dir, not one with files whose ownership you rely on. Never
      # bind-mount a system dir.
      - ${IMAGES_HOST_DIR:-/var/tmp/figma-context-mcp}:${IMAGES_HOST_DIR:-/var/tmp/figma-context-mcp}:Z,U
      # Drop corporate root CAs (.crt / .pem) into ./certs/ next to this
      # compose.yaml. The entrypoint unions everything in /etc/ssl/ca-anchors
      # into a Node-readable bundle and points NODE_EXTRA_CA_CERTS at it.
      # Empty dir = no-op (fine on default-trust hosts).
      # ',Z' relabels for SELinux; safe here because it's a project dir,
      # not a system dir.
      - ./certs:/etc/ssl/ca-anchors:ro,Z
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
