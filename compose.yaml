services:
  figma-context-mcp:
    image: ghcr.io/trick77/figma-context-mcp:latest
    container_name: figma-context-mcp
    restart: "no"
    env_file: .env
    ports:
      - "127.0.0.1:23149:3333"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # Image-download dir. download_figma_images writes here; host-side
      # agents read the files directly. Override IMAGES_HOST_DIR in .env to
      # point at the consuming project's assets dir so its agent finds
      # downloads in its own cwd. Default: ./images next to compose.yaml.
      # ',Z' relabels for SELinux; ',U' chowns the host source to the
      # mapped container UID so the non-root `node` user can write — use
      # a dedicated/empty dir, not one with pre-existing files you care
      # about owning. Project-local only — never bind-mount a system dir.
      - ${IMAGES_HOST_DIR:-./images}:/home/node/images:Z,U
      # Drop corporate root CAs (.crt / .pem) into ./certs/ next to this
      # compose.yaml. The entrypoint unions everything in /etc/ssl/ca-anchors
      # into a Node-readable bundle and points NODE_EXTRA_CA_CERTS at it.
      # Empty dir = no-op (fine on default-trust hosts).
      # ',Z' relabels for SELinux; safe here because it's a project dir,
      # not a system dir.
      - ./certs:/etc/ssl/ca-anchors:ro,Z
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
