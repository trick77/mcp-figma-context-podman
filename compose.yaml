services:
  figma-context-mcp:
    image: ghcr.io/trick77/figma-context-mcp:latest
    container_name: figma-context-mcp
    restart: "no"
    env_file: .env
    ports:
      - "127.0.0.1:23149:3333"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - figma-images:/home/node/images
      # Corporate CA anchors. The entrypoint unions every .crt/.pem in
      # /etc/ssl/ca-anchors into a single bundle and points Node at it via
      # NODE_EXTRA_CA_CERTS. Read-only mount; ',Z' relabels for SELinux on
      # RHEL/Fedora. Comment out (or change the host path) if you don't
      # need a TLS-intercepting corporate proxy.
      - /etc/pki/ca-trust/source/anchors:/etc/ssl/ca-anchors:ro,Z
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64

volumes:
  figma-images:
